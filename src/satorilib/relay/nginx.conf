# The whole nginx config, not a conf.d file: the connection limits live at the
# top level. Each neuron's websocket takes two connections here (one from the
# neuron, one to strfry), so a worker holds about half of worker_connections.
# The stock image's 1024 let a relay hold about 500 neurons per CPU core.
worker_processes auto;
worker_rlimit_nofile 131072;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 65536;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    # strfry's address is looked up as requests come in, from Docker's own DNS:
    # a fixed upstream is resolved once at start, so a recreated strfry
    # container (a new address) left the relay answering 502 until nginx restarted.
    resolver 127.0.0.11 valid=10s;

    map $http_accept $is_nip11 {
        default           0;
        "application/nostr+json" 1;
        "~application/nostr\+json" 1;
    }

    server {
        listen 80;

        # NIP-11: serve relay info document for HTTP requests
        # with Accept: application/nostr+json
        location / {
            if ($is_nip11) {
                rewrite ^ /nip11 last;
            }

            # WebSocket proxy to strfry
            set $strfry strfry:7777;
            proxy_pass http://$strfry;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location = /nip11 {
            internal;
            alias /usr/share/nginx/nip11/nip11.json;
            default_type application/nostr+json;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Headers "Accept";
            add_header Cache-Control "max-age=300";
        }
    }
}
